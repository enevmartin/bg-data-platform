[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bg-data-platform"
version = "0.1.0"
description = "Bulgarian government statistical data pipeline platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    # ORM / DB
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "flower>=2.0.1",
    # Scraping
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # Data processing
    "pandas>=2.2.3",
    "polars>=1.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.1.0",
    # File processors
    "openpyxl>=3.1.5",
    "chardet>=5.2.0",
    "pdfplumber>=0.11.4",
    # Utilities
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bgdata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N805"]

[tool.ruff.lint.isort]
known-first-party = ["platform"]
